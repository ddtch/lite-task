# Deployment compose file: pulls a prebuilt image, never builds.
#
# On a VPS this file plus .env is all you need:
#   docker compose pull && docker compose up -d
#
# To build from source instead (development, or a patched image):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The web port is published on the loopback interface only — a reverse proxy on
# the host terminates TLS and adds authentication. See README → Deploying to a VPS.

x-app: &app
  image: ghcr.io/ddtch/lite-task:${LITE_TASK_TAG:-latest}
  env_file:
    - .env
  volumes:
    - ./data:/app/data
  restart: unless-stopped

services:
  lite-task:
    <<: *app
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8011}:8011"
    environment:
      - PORT=8011
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const r = await fetch('http://localhost:8011/api/projects'); if (!r.ok) Deno.exit(1);",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  bot:
    <<: *app
    command: ["deno", "run", "-A", "bot/main.ts"]
    # Inherited from the image, but these services serve no HTTP.
    healthcheck:
      disable: true
    environment:
      - LITE_TASK_URL=http://lite-task:8011
    depends_on:
      lite-task:
        condition: service_healthy

  event-scheduler:
    <<: *app
    command: ["deno", "run", "-A", "calls/event-scheduler.ts"]
    # Inherited from the image, but these services serve no HTTP.
    healthcheck:
      disable: true
    environment:
      - TZ=${TZ:-America/New_York}
    depends_on:
      lite-task:
        condition: service_healthy

  reminder-scheduler:
    <<: *app
    command: ["deno", "run", "-A", "calls/scheduler.ts"]
    # Inherited from the image, but these services serve no HTTP.
    healthcheck:
      disable: true
    environment:
      - TZ=${TZ:-America/New_York}
    depends_on:
      lite-task:
        condition: service_healthy
